<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOURA · Into the Dot (360°)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --red: #E11737; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: 'Jost', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  canvas.dragging { cursor: grabbing; }

  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, #scrub:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 8px; }

  .fade { transition: opacity .45s ease; }
  #ui.idle .fade { opacity: 0; pointer-events: none; }

  /* 360 compass chip (click to recenter) */
  #compass {
    position: fixed; top: 16px; left: 16px; display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 12px 0 6px; border-radius: 18px;
    background: rgba(0,0,0,.38); border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 13px; letter-spacing: .08em;
  }
  #compass svg { width: 26px; height: 26px; display: block; }
  #compass .lbl { opacity: .9; }

  /* bottom control bar */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 14px;
    padding: 34px 18px 16px; background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
  }
  #bar button { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; flex: none; }
  #bar button:hover { background: rgba(255,255,255,.1); }
  #bar svg { width: 22px; height: 22px; display: block; fill: #fff; }
  #scrub { position: relative; flex: 1; height: 28px; cursor: pointer; touch-action: none; }
  #track { position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--red); }
  #thumb { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; left: 0; box-shadow: 0 0 0 3px rgba(225,23,55,.35); }
  #time { font-size: 13px; letter-spacing: .04em; font-variant-numeric: tabular-nums; opacity: .85; min-width: 78px; text-align: right; }

  /* look-around hint */
  #hint {
    position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 8px);
    display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 22px;
    background: rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 15px; letter-spacing: .03em; opacity: 0; pointer-events: none;
    transition: opacity .6s ease, transform .6s ease; white-space: nowrap;
  }
  #hint.show { opacity: 1; transform: translate(-50%, 0); }
  #hint svg { width: 26px; height: 26px; display: block; }
  #hint svg .hand { animation: sway 2.4s ease-in-out infinite; transform-origin: 16px 20px; }
  @keyframes sway { 0%,100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }

  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; font-size: 16px; line-height: 1.5; opacity: .85; }

  @media (max-width: 520px) {
    #bar { gap: 8px; padding: 30px 10px 12px; }
    #time { min-width: 64px; font-size: 12px; }
    #hint { bottom: 86px; font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #hint svg .hand { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="YOURA 360 degree scene. Drag or use arrow keys to look around."></canvas>

<div id="ui">
  <button id="compass" class="fade" title="Recenter view" aria-label="Recenter view">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="12.5" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
      <g id="cone"><path id="conePath" d="M16 16 L9 4 A13 13 0 0 1 23 4 Z" fill="rgba(255,255,255,.82)"/></g>
      <circle cx="16" cy="16" r="3" fill="#E11737" stroke="#fff" stroke-width="1.2"/>
    </svg>
    <span class="lbl">360°</span>
  </button>

  <div id="hint" role="status" aria-live="polite">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M5 11 l-3 3 3 3 M27 11 l3 3 -3 3" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="hand"><circle cx="16" cy="14" r="4.2" fill="#fff"/><path d="M10 21.5a9 3.2 0 0 0 12 0" fill="none" stroke="#E11737" stroke-width="1.6" stroke-linecap="round"/></g>
    </svg>
    <span id="hintText">Drag to look around</span>
  </div>

  <div id="bar" class="fade">
    <button id="play" aria-label="Pause" title="Pause (Space)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/></svg>
    </button>
    <button id="replay" aria-label="Replay from the start" title="Replay">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.93 8h2.03A5 5 0 1 0 12 7v3L7.5 6 12 2v3z"/></svg>
    </button>
    <div id="scrub" role="slider" tabindex="0" aria-label="Timeline" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0">
      <div id="track"><div id="fill"></div></div>
      <div id="thumb"></div>
    </div>
    <div id="time">0:00 / 0:24</div>
    <button id="fs" aria-label="Full screen" title="Full screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zM15 4h5v5h-2V6h-3zM18 15h2v5h-5v-2h3zM4 15h2v3h3v2H4z"/></svg>
    </button>
  </div>
</div>
<div id="err">This piece needs WebGL, which isn't available in this browser.</div>
